name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install server dependencies
        working-directory: server
        run: pip install -e ".[dev]"
      - name: Lint
        working-directory: server
        run: ruff check .
      - name: Format check
        working-directory: server
        run: ruff format --check .
      - name: Type check
        working-directory: server
        run: mypy authgent_server/ --ignore-missing-imports
      - name: Run server tests
        working-directory: server
        run: pytest tests/ --ignore=tests/simulation_test.py --ignore=tests/agent_to_agent_simulation.py --ignore=tests/adversarial_live_test.py -v --tb=short
      - name: Coverage
        working-directory: server
        run: |
          coverage run -m pytest tests/ --ignore=tests/simulation_test.py --ignore=tests/agent_to_agent_simulation.py --ignore=tests/adversarial_live_test.py -v
          coverage report --fail-under=80
      - name: Verify documented test count matches reality
        if: matrix.python-version == '3.12'
        working-directory: server
        run: |
          # Files we expect to carry the canonical test count. OUTREACH.md
          # was gitignored after the IETF I-D submission (it's the
          # maintainer-private outreach drafts); do not include it here.
          docs="../README.md ../STANDARDS.md"
          actual=$(pytest tests/ --ignore=tests/simulation_test.py --ignore=tests/agent_to_agent_simulation.py --ignore=tests/adversarial_live_test.py --collect-only -q 2>&1 | tail -1 | awk '{print $1}')
          echo "Collected ${actual} tests."
          if ! grep -q "${actual} tests" $docs; then
            echo "::error::Test count drift. Docs do not match ${actual}."
            grep -nE "[0-9]+ tests" $docs | head -10
            exit 1
          fi

  sdk-python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install SDK dependencies
        working-directory: sdks/python
        run: pip install -e ".[dev]"
      - name: Lint
        working-directory: sdks/python
        run: ruff check .
      - name: Run SDK tests
        working-directory: sdks/python
        run: pytest tests/ -v --tb=short

  sdk-typescript-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        working-directory: sdks/typescript
        run: npm ci
      - name: Type check
        working-directory: sdks/typescript
        run: npm run typecheck
      - name: Build
        working-directory: sdks/typescript
        run: npm run build
      - name: Run tests
        working-directory: sdks/typescript
        run: npm test
