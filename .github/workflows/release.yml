name: Release

# Triggered by a git tag of the form vMAJOR.MINOR.PATCH.
# Builds + signs + publishes both PyPI packages and the npm package,
# attaches CycloneDX SBOMs, and cuts a GitHub Release with everything.
#
# Authoritative process: https://docs.pypi.org/trusted-publishers/

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:

  build-server:
    name: Build authgent-server
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Read version from pyproject.toml
        id: read
        run: |
          v=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Verify tag matches pyproject version
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          PYPROJECT_VERSION: ${{ steps.read.outputs.version }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$PYPROJECT_VERSION" ]; then
            echo "Tag $tag does not match pyproject version $PYPROJECT_VERSION" >&2
            exit 1
          fi
      - run: pip install --upgrade build
      - run: python -m build
      - name: Generate CycloneDX SBOM (server)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: server
          format: cyclonedx-json
          artifact-name: authgent-server-sbom.cyclonedx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: authgent-server-dist
          path: server/dist/

  build-python-sdk:
    name: Build authgent (Python SDK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: pip install --upgrade build
      - run: python -m build
      - name: Generate CycloneDX SBOM (python sdk)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: sdks/python
          format: cyclonedx-json
          artifact-name: authgent-pysdk-sbom.cyclonedx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: authgent-python-sdk-dist
          path: sdks/python/dist/

  build-typescript-sdk:
    name: Build authgent (TypeScript SDK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - run: npm pack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: authgent-typescript-sdk-pack
          path: sdks/typescript/*.tgz

  publish-server:
    name: Publish authgent-server to PyPI
    needs: build-server
    # Publish only when the maintainer has set repo variable
    # PUBLISHING_ENABLED=true. Until then we still build + attest +
    # sign + GitHub-release the artifacts; we just skip the upload to
    # PyPI. This lets the rest of the pipeline succeed even when the
    # one-time PyPI Trusted Publishing setup hasn't been done yet.
    if: vars.PUBLISHING_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi-server
      url: https://pypi.org/project/authgent-server/
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: authgent-server-dist
          path: dist/
      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: 'dist/*'
      - name: Sign with Sigstore
        uses: sigstore/gh-action-sigstore-python@f514d46b907ebcd5bedc05145c03b69c1edd8b46 # v3.0.0
        with:
          inputs: ./dist/*.whl ./dist/*.tar.gz
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  publish-python-sdk:
    name: Publish authgent (Python SDK) to PyPI
    needs: build-python-sdk
    # Same gate as publish-server.
    if: vars.PUBLISHING_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi-sdk
      url: https://pypi.org/project/authgent/
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: authgent-python-sdk-dist
          path: dist/
      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: 'dist/*'
      - name: Sign with Sigstore
        uses: sigstore/gh-action-sigstore-python@f514d46b907ebcd5bedc05145c03b69c1edd8b46 # v3.0.0
        with:
          inputs: ./dist/*.whl ./dist/*.tar.gz
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  publish-typescript-sdk:
    name: Publish authgent (TypeScript SDK) to npm
    needs: build-typescript-sdk
    # Same publishing gate; additionally requires NPM_TOKEN secret.
    if: vars.PUBLISHING_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - working-directory: sdks/typescript
        run: |
          npm ci
          npm run build
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: GitHub Release with artifacts + SBOMs
    needs:
      - build-server
      - build-python-sdk
      - build-typescript-sdk
    # Always cut a GitHub Release with the artifacts, even when PyPI/npm
    # publishing is gated off. This means a tag still produces a real,
    # downloadable release a user can curl, plus the SBOMs and the
    # signed Sigstore bundles when those steps run.
    if: always() && (needs.build-server.result == 'success' && needs.build-python-sdk.result == 'success' && needs.build-typescript-sdk.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          generate_release_notes: true
          files: |
            artifacts/authgent-server-dist/*
            artifacts/authgent-python-sdk-dist/*
            artifacts/authgent-typescript-sdk-pack/*
            artifacts/authgent-server-sbom.cyclonedx.json/*
            artifacts/authgent-pysdk-sbom.cyclonedx.json/*
