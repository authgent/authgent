name: Registry snapshot

# Daily JSON snapshot of /api/registry committed to gh-pages so the
# static frontend has a fallback when the Oracle backend is down.
# https://authgent.github.io/authgent/registry-snapshot.json

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      REGISTRY_URL: https://authgent-demo.dhruvagnihotri.com/api/registry
    steps:
      - name: Checkout repository (default branch)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Bootstrap or fetch gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          git config user.name 'authgent-bot'
          git config user.email 'security@authgent.dev'
          # Try to fetch existing gh-pages branch.
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages:gh-pages
            git checkout gh-pages
          else
            # First run: create an orphan gh-pages branch with a
            # minimal README explaining what lives here. Follow-up
            # commits in this workflow add registry-snapshot.json.
            git checkout --orphan gh-pages
            git rm -rf . 2>/dev/null || true
            cat > README.md <<'EOF'
          # gh-pages

          This branch hosts static artifacts the GitHub Pages site
          serves under <https://authgent.github.io/authgent/>, plus
          read-only fallbacks for the API endpoints (used when the
          Oracle backend is unreachable).

          - `registry-snapshot.json` -- automated snapshot of
            `/api/registry` updated every 6 hours by
            `.github/workflows/registry-snapshot.yml`.
          EOF
            git add README.md
            git commit -m "chore: bootstrap gh-pages branch"
            git push --set-upstream "$REPO_URL" gh-pages
          fi
      - name: Fetch live registry
        run: |
          set -e
          for attempt in 1 2 3; do
            if curl -fsSL --max-time 30 "$REGISTRY_URL" -o /tmp/registry.json; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "ERROR: live registry unreachable after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 5))
          done
          python3 -c "
          import json
          d = json.load(open('/tmp/registry.json'))
          assert 'rows' in d and isinstance(d['rows'], list), 'missing rows'
          assert 'generated_at' in d, 'missing generated_at'
          assert d.get('total', 0) > 0, 'empty registry'
          print(f'snapshot ok: {d[\"total\"]} targets, {d[\"scanned\"]} scanned')
          "
      - name: Move snapshot into gh-pages
        run: mv /tmp/registry.json registry-snapshot.json
      - name: Commit snapshot if changed
        run: |
          # Identity already set in the bootstrap step; harmless to repeat.
          git config user.name 'authgent-bot'
          git config user.email 'security@authgent.dev'
          # On first run the file is new; `git diff --quiet` would
          # report no changes (since git doesn't track it yet). Use
          # `git status --porcelain` instead to detect both new files
          # and modifications.
          if [ -z "$(git status --porcelain registry-snapshot.json)" ]; then
            echo "no changes to snapshot"
            exit 0
          fi
          git add registry-snapshot.json
          git commit -m "chore: registry snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin gh-pages
