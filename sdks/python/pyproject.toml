[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "authgent"
version = "0.2.6"
description = "Python SDK for authgent — IETF agent-identity stack: identity-chaining, transaction-tokens, RFC 8693 delegation, DPoP, MCP"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Dhruv Agnihotri" },
]
keywords = [
    "oauth",
    "oauth2.1",
    "identity-chaining",
    "transaction-tokens",
    "rfc-8693",
    "rfc-9449",
    "dpop",
    "mcp",
    "model-context-protocol",
    "agent",
    "ai-agent",
    "a2a",
    "delegation",
    "ietf",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "PyJWT>=2.9.0",
    "cryptography>=43.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.115.0"]
flask = ["flask>=3.0.0"]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/authgent/authgent"
Documentation = "https://github.com/authgent/authgent/tree/main/sdks/python"
Repository = "https://github.com/authgent/authgent"
Changelog = "https://github.com/authgent/authgent/blob/main/CHANGELOG.md"
Issues = "https://github.com/authgent/authgent/issues"

[tool.hatch.build.targets.wheel]
packages = ["authgent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
