[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "authgent-server"
version = "0.3.4"
description = "Open-source reference implementation of the IETF agent-identity stack — OAuth 2.1 + identity-chaining + transaction-tokens + DPoP + MCP"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Dhruv Agnihotri" },
]
keywords = [
    "oauth",
    "oauth2.1",
    "identity-chaining",
    "transaction-tokens",
    "rfc-8693",
    "rfc-9449",
    "dpop",
    "mcp",
    "model-context-protocol",
    "agent",
    "ai-agent",
    "a2a",
    "delegation",
    "ietf",
    "authorization-server",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Systems Administration :: Authentication/Directory",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",
    "cryptography>=43.0.0",
    "PyJWT>=2.9.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "python-ulid>=2.7.0",
    "bcrypt>=4.2.0",
    "structlog>=24.4.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "rich>=13.7.0",
    # Used by `lint --config <path>` and the `openapi` CLI subcommand.
    # Both ship in the base distribution so users do not need a
    # separate extras install for the most common config workflow.
    "PyYAML>=6.0.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30.0"]
# Optional shared cache. With redis installed and AUTHGENT_REDIS_URL set,
# scanner caches (DCR-mirror probe, per-target scan results, registry
# snapshots) move to Redis so multi-worker uvicorn deployments share
# state. Unset REDIS_URL falls back to in-process caches transparently.
redis = ["redis>=5.0.0"]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "coverage>=7.6.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "freezegun>=1.4.0",
    "types-PyYAML>=6.0.0",
]
migrations = ["alembic>=1.13.0"]

[project.urls]
Homepage = "https://github.com/authgent/authgent"
Documentation = "https://github.com/authgent/authgent/tree/main/server"
Repository = "https://github.com/authgent/authgent"
Changelog = "https://github.com/authgent/authgent/blob/main/CHANGELOG.md"
Issues = "https://github.com/authgent/authgent/issues"

[project.scripts]
authgent-server = "authgent_server.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["authgent_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
"tests/simulation_test.py" = ["E501"]
"tests/agent_to_agent_simulation.py" = ["E501"]
"tests/adversarial_live_test.py" = ["E501", "F401", "F541", "F841", "I001"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_any_generics = false
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["authgent_server.models.*"]
disable_error_code = ["name-defined"]

[[tool.mypy.overrides]]
module = ["authgent_server.services.*", "authgent_server.endpoints.*"]
disable_error_code = ["attr-defined"]
