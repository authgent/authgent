name: "authgent MCP-OAuth lint"
description: >
  Grade an MCP server's OAuth posture against RFC 7591, 7636, 8414, 8707,
  9207, 9449, 9728, and the MCP 2025-11-25 / 2026-07-28 spec. Annotates
  findings inline in pull request reviews via GitHub Actions
  workflow-command output. Optionally gates on regressions only via
  --diff against a committed baseline.

branding:
  icon: shield
  color: blue

inputs:
  url:
    description: "MCP server base URL to audit, e.g. https://mcp.example.com"
    required: true
  fail-on:
    description: "Exit non-zero when findings have this severity or higher (info|warning|error|critical)."
    required: false
    default: "error"
  python-version:
    description: "Python interpreter version to install."
    required: false
    default: "3.12"
  baseline:
    description: >
      Path to a baseline JSON file. When set, the action runs in
      --diff mode and exits non-zero only when findings have appeared
      that were NOT in the baseline. Commit a baseline once, then
      every PR is gated on regressions only.
    required: false
    default: ""
  save-baseline:
    description: >
      If 'true', write the current scan output to the path in `baseline`
      (or 'authgent-baseline.json' when baseline is empty) and upload
      it as an artifact. Use this on a manual run to seed the baseline.
    required: false
    default: "false"
  scanner-version:
    description: "Pin a specific authgent-server version. Default: latest."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install authgent-server
      shell: bash
      env:
        SCANNER_VERSION: ${{ inputs.scanner-version }}
      run: |
        if [ -n "$SCANNER_VERSION" ]; then
          pip install --quiet "authgent-server==$SCANNER_VERSION"
        else
          pip install --quiet "authgent-server>=0.3.4"
        fi

    - name: Run authgent lint
      id: lint
      shell: bash
      env:
        # User-controlled inputs feed through env, never interpolated
        # into the script body. This defends against workflow-injection
        # via crafted PR descriptions or branch names.
        TARGET_URL: ${{ inputs.url }}
        BASELINE_PATH: ${{ inputs.baseline }}
        SAVE_BASELINE: ${{ inputs.save-baseline }}
      run: |
        set +e
        diff_args=""
        save_args=""
        baseline_path="$BASELINE_PATH"
        if [ "$SAVE_BASELINE" = "true" ]; then
          if [ -z "$baseline_path" ]; then
            baseline_path="authgent-baseline.json"
          fi
          save_args="--save-baseline=$baseline_path"
        elif [ -n "$BASELINE_PATH" ]; then
          diff_args="--diff=$BASELINE_PATH"
        fi
        # Annotated pass for PR reviewers (inline ::error / ::warning lines).
        authgent-server lint "$TARGET_URL" --format github $diff_args $save_args
        rc_annotated=$?
        # JSON pass produces the artifact uploaded below.
        authgent-server lint "$TARGET_URL" --format json $diff_args > authgent-lint.json
        exit "$rc_annotated"

    - name: Upload findings JSON
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: authgent-lint-findings
        path: authgent-lint.json
